# Publishes fa-console to PyPI automatically on a release tag.
#
# One-time setup (Trusted Publishing — no API token needed):
#   1. Push this repository to GitHub.
#   2. On pypi.org: Account Settings -> Publishing -> add a
#      "pending publisher" for project "fa-console" with this repo,
#      workflow file name "publish.yml", and environment "pypi".
#   3. Create a GitHub release (or push a tag v*) — the workflow builds
#      and uploads automatically.

name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"                 # a plain `git push origin v2.0.0` triggers the publish
  workflow_dispatch: {}      # allows manual runs from the Actions tab

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest

      - name: Run tests
        run: python -m pytest tests -q

  publish:
    needs: test              # never upload a release whose tests fail
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # required for Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
